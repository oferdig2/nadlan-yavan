<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nadlan — Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jquery-ui@1.14.1/dist/themes/base/jquery-ui.min.css" integrity="sha384-zR/jkclV8JzpZv6ONtyAg2c/SJQRL8k3ZYyDf2O9XGHO16FV9l6/kEdN4IGkspLj" crossorigin="anonymous" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/forms.css" />
  <link rel="stylesheet" href="/css/map.css" />
  <link rel="stylesheet" href="/css/files.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="admin-body">
  <header class="app-header">
    <span class="app-title">Nadlan</span>
    <a class="btn" href="/">← Map</a>
    <nav class="view-switch admin-tabs" aria-label="Admin sections">
      <button type="button" data-tab="users" data-requires="MANAGE_USERS" hidden>Users</button>
      <button type="button" data-tab="roles" data-requires="MANAGE_USERS" hidden>Roles</button>
      <button type="button" data-tab="contacts" data-requires="MANAGE_CONTACTS VIEW_ALL_CONTACTS" hidden>Contacts</button>
      <button type="button" data-tab="asset-statuses" data-requires="MANAGE_METADATA" hidden>Statuses</button>
      <button type="button" data-tab="property-types" data-requires="MANAGE_METADATA" hidden>Property types</button>
      <button type="button" data-tab="portfolio-types" data-requires="MANAGE_METADATA" hidden>Portfolio types</button>
      <button type="button" data-tab="contact-roles" data-requires="MANAGE_METADATA" hidden>Contact roles</button>
      <button type="button" data-tab="file-types" data-requires="MANAGE_METADATA" hidden>File types</button>
      <button type="button" data-tab="geographic-areas" data-requires="MANAGE_METADATA" hidden>Areas</button>
    </nav>
  </header>

  <main class="admin-main" id="admin-panel"></main>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-ui@1.14.1/dist/jquery-ui.min.js" integrity="sha384-SStJQoPipVtHHnIgUfDI+jTAbSyU+HMbhwt2XRRNpLIRFg9VguopT6Y4+cdOlkqg" crossorigin="anonymous"></script>
  <script src="/js/api.js"></script>
  <script src="/js/formatters.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/reference-data.js"></script>
  <script src="/js/dialog.js"></script>
  <script src="/js/entity-selector.js"></script>
  <script src="/js/entity-relation-editor.js"></script>
  <script src="/js/contact-editor.js"></script>
  <script src="/js/history-dialog.js"></script>
  <script src="/js/file-upload.js"></script>
  <script src="/js/file-upload-zone.js"></script>
  <script src="/js/file-card.js"></script>
  <script src="/js/file-metadata-editor.js"></script>
  <script src="/js/files-dialog.js"></script>
  <script src="/js/metadata-table-editor.js"></script>
  <script src="/js/admin-contacts.js"></script>
  <script src="/js/resource-access-editor.js"></script>
  <script src="/js/user-editor.js"></script>
  <script src="/js/admin-users.js"></script>
  <script src="/js/admin-roles.js"></script>
  <script src="/js/admin-page.js"></script>
</body>
</html>
