<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nadlan — Password</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/forms.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <h1 data-role="title">Password</h1>
    <p class="auth-sub" data-role="sub">Loading…</p>

    <div class="form-error" data-role="error" hidden></div>

    <form class="form" data-role="form" hidden>
      <input type="email" name="username" autocomplete="username" hidden>
      <label data-role="current">Current password <input class="input" type="password" name="current" autocomplete="current-password"></label>
      <label>New password <input class="input" type="password" name="password" autocomplete="new-password" minlength="8" required></label>
      <label>Repeat new password <input class="input" type="password" name="repeat" autocomplete="new-password" minlength="8" required></label>
      <p class="muted">At least 8 characters. A few words make a strong password that's easy to remember.</p>
      <button type="submit" class="btn btn-primary btn-block">Save password</button>
      <div class="auth-links"><a href="/" data-role="cancel">Cancel</a></div>
    </form>

    <div class="auth-links" data-role="to-login" hidden><a href="/login.html">Go to sign in</a></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
  <script src="/js/api.js"></script>
  <script src="/js/password-page.js"></script>
</body>
</html>
