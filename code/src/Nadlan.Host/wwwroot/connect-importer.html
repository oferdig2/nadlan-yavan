<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GreekPlot — Connect the importer</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/forms.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <h1>Connect the KAEK importer</h1>
    <p class="auth-sub" data-role="who">Loading…</p>

    <div class="form-error" data-role="error" hidden></div>
    <div class="auth-ok" data-role="ok" hidden></div>

    <section data-role="ask" hidden>
      <p>The importer on this computer will save the parcels it finds on the Ktimatologio map into GreekPlot, as you.</p>
      <button type="button" class="btn btn-primary btn-block" data-role="connect">Connect</button>
      <div class="auth-links"><a href="#" data-role="switch">Not you? Sign in as someone else</a></div>
    </section>

    <!-- The importer reads the token from here; it never needs to be seen or copied. -->
    <output id="importer-token" hidden></output>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
  <script src="/js/api.js"></script>
  <script src="/js/connect-importer-page.js"></script>
</body>
</html>
