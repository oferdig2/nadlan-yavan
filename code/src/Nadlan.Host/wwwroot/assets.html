<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GreekPlot — Asset table</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jquery-ui@1.14.1/dist/themes/base/jquery-ui.min.css" integrity="sha384-zR/jkclV8JzpZv6ONtyAg2c/SJQRL8k3ZYyDf2O9XGHO16FV9l6/kEdN4IGkspLj" crossorigin="anonymous" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/forms.css" />
  <link rel="stylesheet" href="/css/files.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/asset-table.css" />
</head>
<body class="asset-table-body">
  <header class="app-header">
    <span class="app-title">GreekPlot</span>
    <nav class="view-switch page-switch" aria-label="Pages">
      <a href="/" data-requires="USE_MAP" hidden>Map</a>
      <a href="/assets.html" class="active" aria-current="page">Table</a>
    </nav>
    <span id="table-status" class="table-status" role="status" aria-live="polite"></span>
    <a class="btn header-admin" href="/admin.html" data-requires="MANAGE_USERS MANAGE_METADATA MANAGE_CONTACTS VIEW_ALL_CONTACTS" hidden>Admin</a>
  </header>

  <!-- The table fills the page. A small map panel may come later beside it (owner, 2026-10-25): .asset-table-layout is a
       flex row so an <aside> can be added without changing the grid. -->
  <div class="asset-table-layout">
    <main id="asset-table" class="asset-table-main"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-ui@1.14.1/dist/jquery-ui.min.js" integrity="sha384-SStJQoPipVtHHnIgUfDI+jTAbSyU+HMbhwt2XRRNpLIRFg9VguopT6Y4+cdOlkqg" crossorigin="anonymous"></script>
  <script src="/js/api.js"></script>
  <script src="/js/formatters.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/reference-data.js"></script>
  <script src="/js/dialog.js"></script>
  <!-- files (the Files button) -->
  <script src="/js/file-upload.js"></script>
  <script src="/js/file-upload-zone.js"></script>
  <script src="/js/file-card.js"></script>
  <script src="/js/file-metadata-editor.js"></script>
  <script src="/js/files-dialog.js"></script>
  <script src="/js/asset-table-page.js"></script>
</body>
</html>
