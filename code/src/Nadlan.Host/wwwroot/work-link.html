<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>GreekPlot</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/forms.css" />
  <link rel="stylesheet" href="/css/work-link.css" />
</head>
<!-- The contractor's page (work requests, piece 2). No sign-in: the link is the access. Mobile first. The token is after
     "#" in the address: browsers never send that part to a server, not even in a referrer (the Maps key needs one). -->
<body class="wl-body">
  <header class="wl-header">
    <span class="app-title">GreekPlot</span>
    <span class="wl-request" id="wl-request"></span>
    <div class="wl-lang" role="group" aria-label="Γλώσσα / Language">
      <button type="button" data-lang="el">ΕΛ</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main class="wl-main">
    <div class="wl-message" id="wl-message" role="status" aria-live="polite"></div>

    <form class="wl-password" id="wl-password" hidden autocomplete="off">
      <h1 data-t="passwordTitle"></h1>
      <p data-t="passwordHelp"></p>
      <input class="input wl-password-input" name="password" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <div class="wl-error" role="alert"></div>
      <button type="submit" class="btn btn-primary wl-big" data-t="passwordOpen"></button>
    </form>

    <div class="wl-app" id="wl-app" hidden>
      <div class="wl-map-box">
        <div class="wl-map" id="wl-map"></div>
        <button type="button" class="btn wl-map-size" data-act="map-size"></button>
      </div>
      <div class="wl-sheet" id="wl-sheet"></div>
    </div>
  </main>

  <div class="wl-toast" id="wl-toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous"></script>
  <script src="/js/formatters.js"></script>
  <script src="/js/work-i18n.js"></script>
  <script src="/js/work-map.js"></script>
  <script src="/js/work-link-api.js"></script>
  <script src="/js/work-link-page.js"></script>
</body>
</html>
