# Nadlan site: everything goes to the app on 127.0.0.1:5515. File uploads go straight from the browser to S3,
# so request bodies stay small. install.sh fills in __SERVER_NAME__ and __ALIAS_REDIRECT__ (for www.example.com: the bare
# example.com is sent on to www); certbot then adds the HTTPS server.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;
    __ALIAS_REDIRECT__

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5515;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
